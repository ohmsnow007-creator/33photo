<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}</style>
</head>
<body>
﻿<title>33PHOTO บิลเงินสด</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#1c1c1c">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700;800&family=Sarabun:wght@400;500;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
  /* Layout: mobile-first app — form cards on top, live A4 sheet preview below, sticky save bar */
  :root {
    --bg: #eceae5;
    --surface: #ffffff;
    --fg: #1c1c1c;
    --muted: #7a766f;
    --border: #d9d5cd;
    --field: #f8f7f4;
    --ink: #1c1c1c;
    --ink-fg: #ffffff;
    --danger: #b3261e;
    --font-display: 'Kanit', 'Sarabun', system-ui, sans-serif;
    --font-body: 'Sarabun', 'Kanit', system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #131315;
      --surface: #1d1d21;
      --fg: #e6e4e0;
      --muted: #96938e;
      --border: #36363b;
      --field: #26262b;
      --ink: #e6e4e0;
      --ink-fg: #1c1c1c;
      --danger: #f2867e;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #131315;
    --surface: #1d1d21;
    --fg: #e6e4e0;
    --muted: #96938e;
    --border: #36363b;
    --field: #26262b;
    --ink: #e6e4e0;
    --ink-fg: #1c1c1c;
    --danger: #f2867e;
    color-scheme: dark;
  }

  [hidden] { display: none !important; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { overscroll-behavior-y: none; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-body);
    font-size: 16px;
    line-height: 1.5;
    -webkit-text-size-adjust: 100%;
  }

  .app {
    max-width: 1180px;
    margin: 0 auto;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 16px 120px;
    display: grid;
    gap: 16px;
  }
  @media (min-width: 960px) {
    .app { grid-template-columns: 420px minmax(0, 1fr); align-items: start; }
    .preview-col { position: sticky; top: 16px; }
  }

  .appbar {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    grid-column: 1 / -1;
  }
  .brand { font-family: var(--font-display); font-size: 1.25rem; line-height: 1.2; }
  .brand b { font-weight: 800; }
  .brand span { font-weight: 300; }
  .brand small { display: block; font-size: 0.8rem; font-weight: 400; color: var(--muted); font-family: var(--font-body); }

  .form-col, .preview-col { display: grid; gap: 12px; min-width: 0; }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px;
    display: grid;
    gap: 12px;
  }
  .card h2 {
    margin: 0;
    font-family: var(--font-display);
    font-size: 1rem;
    font-weight: 500;
  }

  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; border-radius: 12px; background: var(--field); border: 1px solid var(--border); }
  .seg button {
    font: inherit; font-family: var(--font-display); font-size: 0.95rem;
    min-height: 44px; border: 0; border-radius: 9px; background: none; color: var(--muted); cursor: pointer;
  }
  .seg button[aria-pressed="true"] { background: var(--ink); color: var(--ink-fg); font-weight: 500; }
  .seg button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .date3 { display: grid; grid-template-columns: 0.8fr 1.6fr 1fr; gap: 8px; }
  .field { display: grid; gap: 4px; min-width: 0; }
  .field label, .lbl { font-size: 0.82rem; color: var(--muted); font-weight: 500; }

  input, select, textarea {
    font: inherit;
    font-size: 16px;
    color: var(--fg);
    background: var(--field);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    min-height: 46px;
    width: 100%;
    -webkit-appearance: none;
    appearance: none;
  }
  textarea { resize: vertical; min-height: 84px; }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--ink); outline-offset: -1px; }
  select {
    padding-right: 34px;
    background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
    background-position: right 18px center, right 13px center;
    background-size: 5px 5px, 5px 5px;
    background-repeat: no-repeat;
  }

  .btn {
    font: inherit;
    font-family: var(--font-display);
    font-size: 0.95rem;
    min-height: 46px;
    padding: 0 16px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--fg);
    cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  }
  .btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .btn.primary { background: var(--ink); color: var(--ink-fg); border-color: var(--ink); font-weight: 500; }
  .btn.dashed { border-style: dashed; color: var(--muted); width: 100%; }
  .btn:disabled { opacity: 0.6; cursor: progress; }

  /* items */
  .item {
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px;
    display: grid;
    gap: 10px;
    background: var(--field);
  }
  .item input, .item select { background: var(--surface); }
  .item-top { display: flex; gap: 8px; align-items: center; }
  .item-no {
    font-family: var(--font-display); font-weight: 600; font-size: 0.85rem;
    width: 28px; height: 28px; border-radius: 50%;
    background: var(--ink); color: var(--ink-fg);
    display: flex; align-items: center; justify-content: center; flex: none;
  }
  .item-top select { flex: 1; min-width: 0; }
  .del {
    flex: none; width: 46px; height: 46px; border-radius: 10px;
    border: 1px solid var(--border); background: var(--surface); color: var(--muted);
    font-size: 1.4rem; line-height: 1; cursor: pointer;
  }
  .del:hover { color: var(--danger); }
  .item .edit { flex: none; padding: 0 10px; font-size: 0.85rem; }
  .hint { font-size: 0.78rem; color: var(--muted); min-height: 1.2em; }
  .hint.err { color: var(--danger); }
  .num { text-align: right; font-variant-numeric: tabular-nums; }

  .toggle { display: flex; align-items: center; gap: 10px; min-height: 46px; cursor: pointer; }
  .toggle input { width: 22px; height: 22px; min-height: 0; padding: 0; -webkit-appearance: checkbox; appearance: auto; accent-color: var(--ink); }

  .logo-row { display: flex; gap: 12px; align-items: center; }
  .logo-thumb {
    width: 64px; height: 64px; border-radius: 8px; flex: none; overflow: hidden;
    border: 1px solid var(--border); background: #fff;
    display: flex; align-items: center; justify-content: center;
  }
  .logo-thumb img { width: 100%; height: 100%; object-fit: cover; }
  .logo-actions { display: flex; flex-wrap: wrap; gap: 8px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

  /* preview */
  .preview-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .preview-head h2 { margin: 0; font-family: var(--font-display); font-size: 1rem; font-weight: 500; }
  .preview-frame { position: relative; overflow: hidden; border-radius: 6px; box-shadow: 0 1px 2px rgba(0,0,0,.12), 0 8px 24px rgba(0,0,0,.10); background: #fff; }
  .preview-frame .sheet { position: absolute; top: 0; left: 0; transform-origin: 0 0; }

  /* save bar */
  .savebar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
    background: var(--surface);
    border-top: 1px solid var(--border);
    padding-top: 10px;
    padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px));
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .savebar-in { max-width: 1180px; margin: 0 auto; display: flex; align-items: center; gap: 12px; }
  .savebar-total { flex: 1; min-width: 0; line-height: 1.2; }
  .savebar-total small { display: block; color: var(--muted); font-size: 0.78rem; }
  .savebar-total b { font-family: var(--font-display); font-size: 1.35rem; font-weight: 600; font-variant-numeric: tabular-nums; }
  .savebar .btn.primary { min-height: 50px; padding: 0 22px; font-size: 1rem; }

  /* modal */
  .modal {
    position: fixed; inset: 0; z-index: 40;
    background: rgba(0,0,0,.45);
    display: flex; align-items: flex-end; justify-content: center;
    padding-left: max(0px, env(safe-area-inset-left, 0px));
    padding-right: max(0px, env(safe-area-inset-right, 0px));
  }
  .sheet-dlg {
    background: var(--surface); color: var(--fg);
    width: 100%; max-width: 480px;
    border-radius: 18px 18px 0 0;
    padding: 20px 16px calc(16px + env(safe-area-inset-bottom, 0px));
    display: grid; gap: 14px;
    animation: up .18s ease-out;
  }
  @media (min-width: 600px) { .modal { align-items: center; } .sheet-dlg { border-radius: 18px; padding-bottom: 20px; } }
  .sheet-dlg h3 { margin: 0; font-family: var(--font-display); font-weight: 500; font-size: 1.1rem; }
  .sheet-dlg p { margin: 0; color: var(--muted); font-size: 0.92rem; }
  .dlg-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  @keyframes up { from { transform: translateY(24px); opacity: 0; } to { transform: none; opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .sheet-dlg { animation: none; } }

  .toast {
    position: fixed; left: 50%; z-index: 50;
    bottom: calc(86px + env(safe-area-inset-bottom, 0px));
    transform: translateX(-50%);
    background: var(--ink); color: var(--ink-fg);
    padding: 10px 16px; border-radius: 10px; font-size: 0.92rem;
    max-width: calc(100% - 32px); text-align: center;
  }

  #pdfRoot { position: fixed; left: -12000px; top: 0; pointer-events: none; }

  /* ================= A4 sheet (always light — this is what the PDF captures) ================= */
  .sheet {
    --s-ink: #1f1f1f;
    --s-soft: #f4f3ef;
    --s-line: #e3e0d9;
    --s-muted: #77736c;
    width: 794px;
    min-height: 1123px;
    background: #ffffff;
    color: var(--s-ink);
    font-family: 'Sarabun', sans-serif;
    font-size: 14px;
    line-height: 1.55;
    display: flex;
    flex-direction: column;
  }
  .s-top {
    background: var(--s-soft);
    padding: 34px 48px 30px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .s-logo {
    width: 112px; height: 112px; border-radius: 12px;
    background: #ffffff; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
  }
  .s-logo img { width: 112px; height: 112px; object-fit: cover; display: block; }
  .s-mark { text-align: center; font-family: 'Kanit', sans-serif; line-height: 1; color: var(--s-ink); }
  .s-mark b { display: block; font-size: 46px; font-weight: 800; }
  .s-mark span { display: block; font-size: 15px; font-weight: 300; letter-spacing: 3px; margin-top: 2px; }
  .s-title { text-align: right; font-family: 'Kanit', sans-serif; line-height: 1.1; }
  .s-title-th { font-size: 46px; font-weight: 700; }
  .s-title-en { font-size: 18px; font-weight: 300; letter-spacing: 6px; color: var(--s-muted); margin-top: 6px; }

  .s-co {
    padding: 22px 48px 18px;
    display: flex; justify-content: space-between; align-items: flex-start; gap: 24px;
  }
  .s-coname { font-family: 'Kanit', sans-serif; font-size: 21px; font-weight: 600; line-height: 1.3; }
  .s-addr { color: #4a4741; font-size: 14px; max-width: 540px; }
  .s-tel { text-align: right; white-space: nowrap; font-size: 14px; color: #4a4741; padding-top: 4px; }
  .s-tel b { display: block; font-family: 'Kanit', sans-serif; font-size: 18px; font-weight: 500; color: var(--s-ink); }

  .s-box {
    margin: 0 48px;
    border: 1px solid #cfcbc3;
    border-radius: 14px;
    padding: 16px 20px;
    display: grid; grid-template-columns: 1fr 240px; gap: 24px;
  }
  .s-kv { display: grid; grid-template-columns: 120px 1fr; gap: 3px 10px; align-content: start; }
  .s-kv.r { grid-template-columns: 80px 1fr; }
  .s-k { font-weight: 600; white-space: nowrap; }
  .s-v { min-width: 0; overflow-wrap: anywhere; }

  .s-table { margin: 22px 48px 0; width: calc(100% - 96px); border-collapse: collapse; font: inherit; color: inherit; }
  .s-table th {
    background: var(--s-ink); color: #ffffff;
    font-family: 'Kanit', sans-serif; font-weight: 500; font-size: 14px;
    padding: 9px 10px; text-align: center;
  }
  .s-table td { padding: 9px 10px; border-bottom: 1px solid var(--s-line); height: 42px; vertical-align: middle; }
  .s-table tr:nth-child(even) td { background: #faf9f6; }
  .s-table .c-no { width: 44px; text-align: center; }
  .s-det { display: grid; grid-template-columns: auto auto; justify-content: start; gap: 0 18px; margin-top: 4px; font-size: 12px; line-height: 1.5; color: #4a90c4; }
  .s-det div { white-space: nowrap; }
  .s-table .c-qty { width: 124px; text-align: center; }
  .s-table .c-price { width: 118px; text-align: right; font-variant-numeric: tabular-nums; }
  .s-table th.c-price { text-align: right; }

  .s-sum { margin: 14px 48px 0; display: grid; grid-template-columns: 1fr 300px; gap: 24px; align-items: start; }
  .s-words { background: var(--s-soft); border-radius: 10px; padding: 12px 16px; }
  .s-lbl { font-size: 12px; color: var(--s-muted); font-weight: 600; }
  .s-words-v { font-family: 'Kanit', sans-serif; font-size: 16px; font-weight: 500; }
  .s-dep { margin-top: 8px; padding-top: 8px; border-top: 1px solid #dedad2; display: grid; gap: 2px; }
  .s-dep div { display: flex; justify-content: space-between; }
  .s-dep b { font-family: 'Kanit', sans-serif; font-weight: 600; font-variant-numeric: tabular-nums; }
  .s-tot { display: grid; gap: 0; }
  .s-tot-row { display: flex; justify-content: space-between; padding: 6px 12px; border-bottom: 1px solid var(--s-line); }
  .s-tot-row span:last-child { font-variant-numeric: tabular-nums; font-weight: 600; }
  .s-grand {
    margin-top: 8px; background: var(--s-ink); color: #ffffff; border-radius: 10px;
    display: flex; justify-content: space-between; align-items: center; padding: 10px 14px;
    font-family: 'Kanit', sans-serif;
  }
  .s-grand span:first-child { font-size: 15px; font-weight: 500; }
  .s-grand span:last-child { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }

  .s-bottom { margin: 28px 48px 0; display: grid; grid-template-columns: 1fr 260px; gap: 28px; align-items: start; }
  .s-notes-h { font-family: 'Kanit', sans-serif; font-weight: 600; font-size: 15px; margin-bottom: 4px; }
  .s-notes-v { white-space: pre-wrap; overflow-wrap: anywhere; color: #3d3a35; }
  .s-sign {
    border: 1px solid #cfcbc3; border-radius: 14px;
    padding: 14px 18px 16px; text-align: center;
  }
  .s-sign-h { font-family: 'Kanit', sans-serif; font-weight: 500; font-size: 15px; }
  .s-sign-space { height: 90px; }
  .s-sign-line { border-top: 1px dotted #8f8b84; margin: 0 6px; }
  .s-sign-name { margin-top: 8px; font-size: 15px; font-weight: 600; color: var(--s-ink); }
  .s-sign-date { margin-top: 4px; color: var(--s-muted); font-size: 13px; }

  .s-foot {
    margin-top: auto;
    background: var(--s-soft);
    padding: 14px 48px;
    display: flex; justify-content: space-between; gap: 16px;
    font-size: 13px; color: #4a4741;
  }
  .s-foot b { font-family: 'Kanit', sans-serif; font-weight: 600; color: var(--s-ink); }
  .s-spacer { height: 20px; }
</style>

<div class="app">
  <header class="appbar">
    <div class="brand"><b>33</b><span>PHOTO</span><small>บิลเงินสด</small></div>
    <button class="btn" id="newBill" type="button">บิลใหม่</button>
  </header>

  <div class="form-col">
    <section class="card">
      <h2>โลโก้</h2>
      <div class="logo-row">
        <div class="logo-thumb" id="logoThumb"></div>
        <div class="logo-actions">
          <label class="btn" for="logoFile">เลือกรูปโลโก้</label>
          <input class="sr" type="file" id="logoFile" accept="image/*">
          <button class="btn" type="button" id="logoReset">กลับเป็นโลโก้เดิม</button>
        </div>
      </div>
    </section>

    <section class="card">
      <h2>ข้อมูลบิล</h2>
      <div class="seg" role="group" aria-label="ประเภทเอกสาร">
        <button type="button" data-doc="cash" aria-pressed="true">บิลเงินสด</button>
        <button type="button" data-doc="quote" aria-pressed="false">ใบเสนอราคา</button>
      </div>
      <div class="field"><label for="billNo">เลขที่</label><input id="billNo" type="text" autocomplete="off"></div>
      <div class="field">
        <label for="dD">วันที่</label>
        <div class="date3">
          <select id="dD" aria-label="วัน"></select>
          <select id="dM" aria-label="เดือน"></select>
          <select id="dY" aria-label="ปี พ.ศ."></select>
        </div>
      </div>
      <div class="field">
        <label for="pay">ชำระโดย</label>
        <div class="item-top">
          <select id="pay"></select>
          <button type="button" class="btn" id="payEdit" hidden>แก้ข้อความ</button>
        </div>
      </div>
    </section>

    <section class="card">
      <h2>ข้อมูลลูกค้า</h2>
      <div class="field"><label for="cName">ชื่อลูกค้า / บริษัท</label><input id="cName" type="text" autocomplete="off" placeholder="เช่น คุณสมชาย ใจดี"></div>
      <div class="field"><label for="cAddr">ที่อยู่</label><textarea id="cAddr" rows="2" placeholder="ที่อยู่ลูกค้า"></textarea></div>
      <div class="grid2">
        <div class="field"><label for="cPhone">เบอร์โทร</label><input id="cPhone" type="tel" inputmode="tel" autocomplete="off" placeholder="08x xxx xxxx"></div>
        <div class="field"><label for="cTax">เลขผู้เสียภาษี</label><input id="cTax" type="text" inputmode="numeric" autocomplete="off" placeholder="ถ้ามี"></div>
      </div>
    </section>

    <section class="card">
      <h2>รายการ</h2>
      <div id="items" style="display:grid;gap:10px"></div>
      <button class="btn dashed" id="addItem" type="button">+ เพิ่มรายการ</button>
    </section>

    <section class="card">
      <h2>สรุปยอด</h2>
      <div class="field"><label for="discount">ส่วนลด (บาท)</label><input id="discount" class="num" type="text" inputmode="decimal" placeholder="0"></div>
      <label class="toggle"><input type="checkbox" id="vat"> คิดภาษีมูลค่าเพิ่ม 7%</label>
    </section>

    <section class="card">
      <h2>หมายเหตุ</h2>
      <div class="field"><label for="notes" class="sr">หมายเหตุ</label><textarea id="notes" rows="3" placeholder="หมายเหตุเพิ่มเติม (ถ้ามี)"></textarea></div>
    </section>
  </div>

  <div class="preview-col">
    <div class="preview-head"><h2>ตัวอย่างบิล</h2><span class="lbl">PDF จะออกมาตามนี้ทุกจุด</span></div>
    <div class="preview-frame" id="previewFrame"><div class="sheet" id="previewSheet"></div></div>
  </div>
</div>

<div class="savebar">
  <div class="savebar-in">
    <div class="savebar-total"><small>ยอดชำระ</small><b id="barTotal">฿0</b></div>
    <button class="btn primary" id="savePdf" type="button">บันทึก PDF</button>
  </div>
</div>

<div id="pdfRoot" aria-hidden="true"><div class="sheet" id="pdfSheet"></div></div>

<div class="modal" id="modal" hidden>
  <div class="sheet-dlg" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <h3 id="modalTitle"></h3>
    <p id="modalText"></p>
    <input id="modalInput" type="text" autocomplete="off" hidden>
    <div class="dlg-actions">
      <button class="btn" id="modalCancel" type="button">ยกเลิก</button>
      <button class="btn primary" id="modalOk" type="button">ตกลง</button>
    </div>

  function num(v) { var n = parseFloat(String(v || '').replace(/,/g, '')); return isNaN(n) ? 0 : n; }
  function money(n) {

  function bahtText(n) {
    n = Math.round(n * 100) / 100;

    var D = ['', 'หนึ่ง', 'สอง', 'สาม', 'สี่', 'ห้า', 'หก', 'เจ็ด', 'แปด', 'เก้า'];
    var P = ['', 'สิบ', 'ร้อย', 'พัน', 'หมื่น', 'แสน'];
    function chunk(x) {
      var s = String(x), r = '', len = s.length;

  var previewSheet = document.getElementById('previewSheet');
  var previewFrame = document.getElementById('previewFrame');
  var pdfSheet = document.getElementById('pdfSheet');

  function fitPreview() {
    var w = previewFrame.clientWidth;
    var scale = w / 794;
    previewSheet.style.transform = 'scale(' + scale + ')';
    previewFrame.style.height = (previewSheet.offsetHeight * scale) + 'px';
  }

  var drawQueued = false;
  function draw() {
    if (drawQueued) return;
    drawQueued = true;
    setTimeout(function () {
      drawQueued = false;
      var html = sheetHTML();
      previewSheet.innerHTML = html;
      fitPreview();
      document.getElementById('barTotal').textContent = '฿' + money(totals().grand);
    }, 0);
  }
  if (window.ResizeObserver) new ResizeObserver(fitPreview).observe(previewFrame);
  window.addEventListener('resize', fitPreview);

  // ---------- form ----------
  var $ = function (id) { return document.getElementById(id); };
  var simple = ['cName', 'cAddr', 'cPhone', 'cTax', 'discount', 'notes'];
  $('billNo').addEventListener('input', function () { state[noKey()] = this.value; persist(); draw(); });
  function renderDoc() {
    var segs = document.querySelectorAll('.seg button');
    for (var i = 0; i < segs.length; i++) segs[i].setAttribute('aria-pressed', String(segs[i].getAttribute('data-doc') === state.docType));
    $('billNo').value = curNo() || '';
    document.querySelector('.brand small').textContent = docInfo().th;
    document.querySelector('.savebar-total small').textContent = docInfo().grand;
  }
  Array.prototype.forEach.call(document.querySelectorAll('.seg button'), function (b) {
    b.addEventListener('click', function () {
      state.docType = b.getAttribute('data-doc');
      renderDoc(); persist(); draw();
    });
  });
  var map = {};

  var MONTHS = ['มกราคม', 'กุมภาพันธ์', 'มีนาคม', 'เมษายน', 'พฤษภาคม', 'มิถุนายน', 'กรกฎาคม', 'สิงหาคม', 'กันยายน', 'ตุลาคม', 'พฤศจิกายน', 'ธันวาคม'];
  function renderDate() {
    var m = String(state.date || todayISO()).match(/^(\d{4})-(\d{2})-(\d{2})$/) || todayISO().match(/^(\d{4})-(\d{2})-(\d{2})$/);
    var y = +m[1], mo = +m[2], d = +m[3];
    var thisYear = new Date().getFullYear();
    var dY = $('dY'), dM = $('dM'), dD = $('dD');
    dY.innerHTML = '';
    for (var yy = Math.min(y, thisYear - 2); yy <= Math.max(y, thisYear + 3); yy++) dY.add(new Option(String(yy + 543), String(yy)));
    dM.innerHTML = '';
    MONTHS.forEach(function (name, i) { dM.add(new Option(name, String(i + 1))); });
    var days = new Date(y, mo, 0).getDate();
    dD.innerHTML = '';
    for (var dd = 1; dd <= days; dd++) dD.add(new Option(String(dd), String(dd)));
    dY.value = String(y); dM.value = String(mo); dD.value = String(Math.max(1, Math.min(d, days)));
  }
  function readDate() {
    var y = +$('dY').value, mo = +$('dM').value, d = +$('dD').value;
    d = Math.max(1, Math.min(d || 1, new Date(y, mo, 0).getDate()));
    state.date = y + '-' + String(mo).padStart(2, '0') + '-' + String(d).padStart(2, '0');
    renderDate(); persist(); draw();
  }
  ['dD', 'dM', 'dY'].forEach(function (id) { $(id).addEventListener('change', readDate); });

  function fillForm() {
    simple.forEach(function (id) { $(id).value = state[map[id] || id] || ''; });
    $('vat').checked = !!state.vat;
    renderDoc();
    renderDate();
    renderPay();
    renderLogo();
    renderItems();
  }
  simple.forEach(function (id) {
    $(id).addEventListener('input', function () { state[map[id] || id] = this.value; persist(); draw(); });
  });
  $('discount').addEventListener('blur', function () {
    if (this.value.trim()) { this.value = money(num(this.value)); state.discount = this.value; persist(); }
  });
  $('vat').addEventListener('change', function () { state.vat = this.checked; persist(); draw(); });

  function renderPay() {
    var sel = $('pay');
    sel.innerHTML = '';
    PAYS.forEach(function (p) { sel.add(new Option(p.t, p.v)); });
    sel.add(new Option(state.pay === OTHER && state.payCustom ? state.payCustom : 'อื่นๆ (พิมพ์เอง)', OTHER));
    sel.value = state.pay;
    $('payEdit').hidden = state.pay !== OTHER;
  }
  function askPay() {
    var before = state.pay;
    askText('ชำระโดย', 'พิมพ์วิธีชำระหรือสถานะ เช่น โอนเงิน, มัดจำ 30%', state.payCustom, function (val) {
      if (val !== null && val.trim()) { state.pay = OTHER; state.payCustom = val.trim(); }
      else if (before !== OTHER || !state.payCustom) state.pay = before === OTHER ? 'cash' : before;
      renderPay(); persist(); draw();
    });
  }
  $('pay').addEventListener('change', function () {
    if (this.value === OTHER) askPay();
    else { state.pay = this.value; renderPay(); persist(); draw(); }
  });
  $('payEdit').addEventListener('click', askPay);

  function renderLogo() {
    $('logoThumb').innerHTML = '<img src="' + esc(state.logo || DEFAULT_LOGO) + '" alt="โลโก้">';
    $('logoReset').hidden = !state.logo;
  }
  $('logoFile').addEventListener('change', function () {
    var f = this.files && this.files[0];
    this.value = '';
    if (!f) return;
    var img = new Image();
    var url = URL.createObjectURL(f);
    img.onload = function () {
      var size = 448, c = document.createElement('canvas');
      c.width = c.height = size;
      var x = c.getContext('2d');
      x.fillStyle = '#ffffff'; x.fillRect(0, 0, size, size);
      var s = Math.max(size / img.width, size / img.height);
      var w = img.width * s, h = img.height * s;
      x.drawImage(img, (size - w) / 2, (size - h) / 2, w, h);
      URL.revokeObjectURL(url);
      state.logo = c.toDataURL('image/jpeg', 0.92);
      persist(); renderLogo(); draw();
    };
    img.onerror = function () { URL.revokeObjectURL(url); toast('เปิดรูปนี้ไม่ได้ ลองเลือกไฟล์ JPG หรือ PNG'); };
    img.src = url;
  });
  $('logoReset').addEventListener('click', function () { state.logo = null; persist(); renderLogo(); draw(); });

  var itemsEl = $('items');
  function renderItems() {
    itemsEl.innerHTML = '';
    state.items.forEach(function (it, i) { itemsEl.appendChild(itemEl(it, i)); });
  }
  function buildOptions(sel, it) {
    sel.innerHTML = '';
    SERVICES.forEach(function (s) { sel.add(new Option(s, s)); });
    sel.add(new Option(it.service === OTHER && it.custom ? it.custom : 'อื่นๆ (พิมพ์เอง)', OTHER));
    sel.value = it.service;
  }
  function itemEl(it, i) {
    var box = document.createElement('div');
    box.className = 'item';
    box.innerHTML =
      '<div class="item-top"><div class="item-no">' + (i + 1) + '</div>' +
      '<label class="sr" for="svc' + i + '">รายการที่ ' + (i + 1) + '</label><select id="svc' + i + '"></select>' +
      '<button type="button" class="btn edit">แก้ชื่อ</button>' +
      '<button type="button" class="del" aria-label="ลบรายการที่ ' + (i + 1) + '">×</button></div>' +
      '<div class="hint det-hint" hidden></div>' +
      '<div class="grid2">' +
        '<div class="field"><label for="hrs' + i + '">จำนวน (ชั่วโมง)</label><input id="hrs' + i + '" type="text" inputmode="decimal" placeholder="1.30" autocomplete="off"><div class="hint"></div></div>' +
        '<div class="field"><label for="prc' + i + '">ราคา (บาท)</label><input id="prc' + i + '" class="num" type="text" inputmode="decimal" placeholder="0" autocomplete="off"></div>' +
      '</div>';
    var sel = box.querySelector('select');
    var hrs = box.querySelector('#hrs' + i);
    var prc = box.querySelector('#prc' + i);
    var hint = box.querySelector('.hint');
    buildOptions(sel, it);
    hrs.value = it.hours;
    prc.value = it.price;

    var detHint = box.querySelector('.det-hint');
    function showDet() {
      var det = it.service !== OTHER && SERVICE_DETAILS[it.service];
      detHint.hidden = !det;
      if (det) detHint.textContent = 'บิลจะแสดงรายละเอียดแพ็กเกจ ' + det.length + ' ข้อ: ' + det.join(' · ');
    }
    showDet();
    sel.addEventListener('change', showDet);
    function showHint() {
      var h = parseHours(hrs.value);
      hint.textContent = h.ok ? (h.text ? '= ' + h.text : 'เช่น 1.30 = 1 ชม. 30 นาที') : h.msg;
      hint.classList.toggle('err', !h.ok);
    }
    showHint();

    sel.addEventListener('change', function () {
      if (sel.value === OTHER) {
        var before = it.service;
        askText('อื่นๆ', 'พิมพ์ชื่อรายการที่ต้องการ', it.custom, function (val) {
          if (val === null || !val.trim()) {
            if (before !== OTHER || !it.custom) it.service = before === OTHER ? SERVICES[0] : before;
          } else {
            it.service = OTHER; it.custom = val.trim();
          }
          buildOptions(sel, it); edit.hidden = it.service !== OTHER; showDet(); persist(); draw();
        });
      } else {
        it.service = sel.value; edit.hidden = true; persist(); draw();
      }
    });
    hrs.addEventListener('input', function () { it.hours = hrs.value; showHint(); persist(); draw(); });
    prc.addEventListener('input', function () { it.price = prc.value; persist(); draw(); });
    prc.addEventListener('blur', function () {
      if (prc.value.trim()) { prc.value = money(num(prc.value)); it.price = prc.value; persist(); }
    });
    box.querySelector('.del').addEventListener('click', function () {
      if (state.items.length === 1) { state.items[0] = blankItem(); }
      else state.items.splice(state.items.indexOf(it), 1);
      persist(); renderItems(); draw();
    });
    var edit = box.querySelector('.edit');
    edit.hidden = it.service !== OTHER;
    edit.addEventListener('click', function () {
      askText('แก้ชื่อรายการ', 'พิมพ์ชื่อรายการที่ต้องการ', it.custom, function (val) {
        if (val !== null && val.trim()) { it.custom = val.trim(); buildOptions(sel, it); persist(); draw(); }
      });
    });
    return box;
  }
  $('addItem').addEventListener('click', function () {
    state.items.push(blankItem());
    persist(); renderItems(); draw();
    var last = itemsEl.lastElementChild;
    if (last) last.scrollIntoView({ behavior: 'smooth', block: 'center' });
  });

  // ---------- modal ----------
  var modal = $('modal'), mInput = $('modalInput'), mCb = null, mIsText = false;
  function openModal(title, text, isText, value, okLabel, cb, cancelLabel) {
    $('modalTitle').textContent = title;
    $('modalText').textContent = text;
    $('modalOk').textContent = okLabel || 'ตกลง';
    $('modalCancel').textContent = cancelLabel || 'ยกเลิก';
    mIsText = isText; mCb = cb;
    mInput.hidden = !isText;
    mInput.value = value || '';
    modal.hidden = false;
    setTimeout(function () { (isText ? mInput : $('modalOk')).focus(); }, 30);
  }
  function closeModal(result) {
    modal.hidden = true;
    var cb = mCb; mCb = null;
    if (cb) cb(result);
  }
  function askText(title, text, value, cb) { openModal(title, text, true, value, 'ใช้ชื่อนี้', cb); }
  $('modalOk').addEventListener('click', function () { closeModal(mIsText ? mInput.value : true); });
  $('modalCancel').addEventListener('click', function () { closeModal(mIsText ? null : false); });
  modal.addEventListener('click', function (e) { if (e.target === modal) closeModal(mIsText ? null : false); });
  mInput.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); closeModal(mInput.value); } });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !modal.hidden) closeModal(mIsText ? null : false); });

  $('newBill').addEventListener('click', function () {
    openModal('เริ่ม' + docInfo().th + 'ใหม่', 'ล้างข้อมูลลูกค้าและรายการทั้งหมด เลขที่จะขึ้นเลขถัดไป', false, '', 'เริ่มใหม่', function (ok) {
      if (!ok) return;
      state = freshState(state);
      persist(); fillForm(); draw();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  });

  // ---------- toast ----------
  var toastTimer;
  function toast(msg) {
    var t = $('toast');
    t.textContent = msg; t.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.hidden = true; }, 3200);
  }

  // ---------- PDF ----------
  var downloadsP = (window.claude && window.claude.use) ? window.claude.use('downloads').catch(function () { return null; }) : Promise.resolve(null);

  function loadFonts() {
    if (!document.fonts || !document.fonts.load) return Promise.resolve();
    var faces = ['300 16px Kanit', '400 16px Kanit', '500 16px Kanit', '600 16px Kanit', '700 16px Kanit', '800 16px Kanit',
      '400 16px Sarabun', '600 16px Sarabun'];
    return Promise.all(faces.map(function (f) { return document.fonts.load(f, 'กขค33ABC'); })).then(function () { return document.fonts.ready; });
  }

  function renderPdfCanvas() {
    pdfSheet.innerHTML = sheetHTML();
    return loadFonts().then(function () {
      return html2canvas(pdfSheet, {
        width: 794,
        height: Math.max(1123, pdfSheet.offsetHeight),
        scale: 2.5,
        backgroundColor: '#ffffff',
        useCORS: true,
        logging: false,
        windowWidth: 1200,
        scrollX: 0,
        scrollY: 0
      });
    });
  }

  function buildPdf() {
    return renderPdfCanvas().then(function (canvas) {
      var jsPDF = window.jspdf.jsPDF;
      var wMM = 210;
      var hMM = canvas.height * wMM / canvas.width;
      if (Math.abs(hMM - 297) < 0.5) hMM = 297;
      var doc = new jsPDF({ unit: 'mm', format: [wMM, hMM], orientation: 'portrait', compress: true });
      doc.addImage(canvas.toDataURL('image/jpeg', 0.95), 'JPEG', 0, 0, wMM, hMM, undefined, 'FAST');
      doc.setProperties({ title: docInfo().th + ' 33PHOTO ' + curNo(), creator: '33PHOTO' });
      return doc;
    });
  }
  window.__bill33 = { renderPdfCanvas: renderPdfCanvas };

  function afterSave(no) {
    var next = nextNo(no);
    var kind = docInfo().th;
    openModal('บันทึก PDF แล้ว', kind + 'เลขที่ ' + no + ' บันทึกแล้ว เริ่ม' + kind + 'ถัดไปเลขที่ ' + next + ' เลยไหม ข้อมูลลูกค้าและรายการจะถูกล้าง', false, '', 'เริ่ม ' + next, function (ok) {
      if (!ok) return;
      var key = noKey();
      state = freshState(state);
      state[key] = next;
      persist(); fillForm(); draw();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }, 'อยู่ใบนี้');
  }

  $('savePdf').addEventListener('click', function () {
    var btn = this;
    if (!window.html2canvas || !window.jspdf) { toast('ระบบสร้าง PDF ยังโหลดไม่เสร็จ ลองใหม่อีกครั้ง'); return; }
    btn.disabled = true; btn.textContent = 'กำลังสร้าง…';
    var no = String(curNo() || '').trim() || docInfo().th;
    var name = no.replace(/[\\/:*?"<>|]+/g, '-') + ' ' + docInfo().th + ' 33PHOTO.pdf';
    Promise.all([buildPdf(), downloadsP]).then(function (r) {
      var doc = r[0], dl = r[1];
      if (dl) {
        return dl.save({ filename: name, data: doc.output('blob') }).then(function () {
          afterSave(no);
        }, function (err) {
          var code = err && err.code;
          if (code === 'declined') toast('ยกเลิกการบันทึก');
          else if (code === 'rate_limited') toast('มีหน้าต่างบันทึกเปิดอยู่ ลองใหม่อีกครั้ง');
          else toast('บันทึกไฟล์ในหน้านี้ไม่ได้');
        });
      }
      doc.save(name);
      afterSave(no);
    }).catch(function () {
      toast('สร้าง PDF ไม่สำเร็จ ลองใหม่อีกครั้ง');
    }).then(function () {
      btn.disabled = false; btn.textContent = 'บันทึก PDF';
    });
  });

  fillForm();
  draw();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitPreview);
})();
</script>

</body>
